[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "topology-pino-opf"
version = "0.1.0"
description = "Topology-conditioned AC-OPF surrogates with physics-informed graph neural operators"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Research code contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "pandas>=2.1,<3",
  "PyYAML>=6.0,<7",
  "torch>=2.2,<3",
  "pandapower>=2.14,<4",
  "networkx>=3.2,<4",
  "h5py>=3.10,<4",
  "tensorboard>=2.15,<3",
  "matplotlib>=3.8,<4",
  "seaborn>=0.13,<1",
  "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
  "mypy>=1.10,<2",
]
wandb = ["wandb>=0.17,<1"]

[tool.setuptools.packages.find]
include = ["data_gen*", "models*", "losses*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "output", "results", "runs", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
